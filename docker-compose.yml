# Local development only; this is not a production deployment profile.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Hex-only POSTGRES_PASSWORD is recommended so this URI needs no escaping.
      DATABASE_URL: postgresql://studio:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/studio
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      NODE_ENV: development
      AUTH_LOCAL_ENABLED: ${AUTH_LOCAL_ENABLED:-false}
      MEDIA_LOCAL_ENABLED: ${MEDIA_LOCAL_ENABLED:-false}
      API_HOST: 0.0.0.0
      PORT: "4000"
      STORAGE_ROOT: /var/lib/studio
      MEDIA_WORK_ROOT: /var/lib/studio
      MEDIA_WORKER_SCRIPT: /app/workers/media/media_worker.py
      PYTHON_BIN: python3
      FFMPEG_PATH: /usr/bin/ffmpeg
      FFPROBE_PATH: /usr/bin/ffprobe
      FONT_PATH: /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      FONT_LICENSE_PATH: /usr/share/doc/fonts-dejavu-core/copyright
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - studio_storage:/var/lib/studio
    depends_on:
      db:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      API_URL: http://api:4000
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  # One-shot diagnostic, not a queue consumer. The API's development supervisor
  # and this isolated command share the same local volume at different paths.
  media-worker:
    profiles: [tools]
    build:
      context: .
      dockerfile: Dockerfile.media
    environment:
      MEDIA_WORK_ROOT: /work
      MEDIA_TIMEOUT_SECONDS: "600"
    volumes:
      - studio_storage:/work
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2g
    cpus: 2.0
    stdin_open: true

volumes:
  postgres_data:
  studio_storage:
